plugins {
    id 'java'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'xyz.jpenilla.run-velocity' version '2.3.1'
}

group = 'com.bearnation'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = 'luckperms'
        url = 'https://repo.lucko.me/'
    }
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    annotationProcessor("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")

    implementation 'org.tomlj:tomlj:1.1.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.14.0'
    implementation 'net.kyori:adventure-text-minimessage:4.14.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.google.code.gson:gson:2.10.1' // Or the latest version
    implementation 'org.yaml:snakeyaml:2.2'
    implementation "io.nats:jnats:2.17.6"

    shadow 'com.mysql:mysql-connector-j:8.4.0'
    compileOnly 'net.luckperms:api:5.4'
}

shadowJar {
    archiveClassifier.set('') // Replace default jar
    relocate 'org.tomlj', 'com.bearnation.libs.tomlj'
    relocate 'com.mysql', 'com.bearnation.shadow.mysql'
    relocate 'com.mysql.cj', 'com.bearnation.shadow.mysql.cj'
    relocate 'io.nats', 'com.bearnation.libs.io.nats'

    doLast {
        def jarFile = archiveFile.get().asFile
        println "✅ Checking for MySQL classes in: ${jarFile.name}"
        zipTree(jarFile).visit {
            if (it.name.endsWith(".class") && it.path.contains("mysql")) {
                println it.path
            }
        }
    }
}

tasks.named("build") {
    dependsOn tasks.named("shadowJar")
}

tasks.named("runVelocity") {
    velocityVersion.set("3.4.0-SNAPSHOT")
}

artifacts {
    archives shadowJar
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')

def generateTemplates = tasks.register('generateTemplates', Copy) {
    def props = ['version': project.version]
    inputs.properties props

    from templateSource
    into templateDest
    expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

idea.project.settings.taskTriggers.afterSync(generateTemplates)
eclipse.synchronizationTasks(generateTemplates)
